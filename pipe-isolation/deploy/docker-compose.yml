version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isolation
      POSTGRES_PASSWORD: isolation
      POSTGRES_DB: isolation
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isolation -d isolation"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg2://isolation:isolation@postgres:5432/isolation
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
